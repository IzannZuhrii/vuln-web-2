services:
  db:
    image: mariadb:11
    container_name: class_profile_db
    restart: always
    environment:
      MYSQL_DATABASE: class_profile
      MYSQL_USER: classuser
      MYSQL_PASSWORD: classpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - class_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: class_profile_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_USER=classuser
      - DATABASE_PASSWORD=classpassword
      - DATABASE_NAME=class_profile
    depends_on:
      - db
    networks:
      - class_network

networks:
  class_network:
    driver: bridge

volumes:
  mariadb_data:
